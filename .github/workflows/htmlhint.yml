name: HTMLHint HTML Check
on:
  pull_request: 
  push:

permissions:
  contents: read

jobs:
  htmlhint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        
      - name: Install dependencies
        run: npm ci
    
      - name: Run HTMLHint
        run: npm run lint:html
