name: Backend CI

on:
  pull_request: 
    branches: 
      - main
      - master
  push:
    branches:
      - main
      - master
  
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend quality checks and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
    
    env:
      RUFF_TARGETS:  >-
        account.py
        tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create CI env file
        run: cp ../.env.ci .env
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
        
      - name: Run Ruff lint check
        id: ruff_lint
        continue-on-error: true
        run: python -m ruff check $RUFF_TARGETS
      
      - name: Run Ruff format check
        id: ruff_format
        continue-on-error: true
        run: python -m ruff format --check $RUFF_TARGETS

      - name: Auto-fix Ruff issues
        if: steps.ruff_lint.outcome == 'failure' || steps.ruff_format.outcome == 'failure'
        run: |
          python -m ruff check --fix $RUFF_TARGETS || true
          python -m ruff format $RUFF_TARGETS
      
      - name: Commit Ruff auto-fixes
        if: >-
          (steps.ruff_lint.outcome == 'failure' || steps.ruff_format.outcome == 'failure') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply ruff auto-fixes"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.git
    
      
      - name: Verify Ruff lint check
        run: python -m ruff check $RUFF_TARGETS
      
      - name: Verify Ruff format check
        run: python -m ruff format --check $RUFF_TARGETS
      
      - name: Run tests
        run: python -m pytest -v


          
  docker-check:
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI env file
        run: cp .env.ci .env
      
      - name: Validate Docker Compose
        run: docker compose -f compose.dev.yaml config
    
      - name: Build Docker images
        run: docker compose -f compose.dev.yaml build